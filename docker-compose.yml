services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Persists the knowledge base index and audit log across restarts
      # (T-28) -- without this, every `docker compose up` would re-run
      # four live ingestion API calls to rebuild the KB from scratch.
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
